name: Test

# On-demand / ad-hoc test workflow, separate from release.yaml's release-gate
# test job. Two ways to run it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
# Never triggered by push/PR on branches -- this repo deliberately doesn't run
# CI on every commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install proxylib with all extras
        run: python -m pip install -e ".[dev,dukpy,pac]"

      # GNOME/MATE proxy detection is only exercisable against a
      # real gsettings/dconf + dbus session, not just monkeypatched seams.
      - name: Install desktop proxy tooling (gsettings/dbus)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gsettings-desktop-schemas dbus-x11

      # Diagnostic only (not a test assertion): gsettings batching
      # needs to know whether org.gnome.system.proxy's child schemas
      # (.http, .https) are included in a recursive listing. Surface it in
      # the run log so that question can be answered from a real CI machine.
      - name: Probe gsettings recursive schema listing (diagnostic)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dbus-run-session -- gsettings list-recursively org.gnome.system.proxy || true

      - name: Run tests (dbus session)
        if: matrix.os == 'ubuntu-latest'
        run: dbus-run-session -- python -m pytest -q -W error::UserWarning

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: python -m pytest -q -W error::UserWarning

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`),
  # on the oldest supported Python. The matrix above only ever gets the newest
  # releases, so a floor that no longer works would otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev,dukpy,pac]"
      - name: Run tests
        run: python -m pytest -q -W error::UserWarning
