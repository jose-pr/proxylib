site_name: proxylib
site_description: Platform-agnostic proxy configuration for Python
site_url: https://jose-pr.github.io/proxylib/
repo_url: https://github.com/jose-pr/proxylib
repo_name: jose-pr/proxylib
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - API Reference:
      - Core (Proxy, ProxyMap, EnvProxyConfig): api/core.md
      - System detection: api/os.md
      - PAC support: api/pac.md
      - requests / urllib integrations: api/integrations.md
      - Patching registry: api/patching.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
