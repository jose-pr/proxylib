[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxylib"
version = "1.0.0"
authors = [{ name = "Jose A" }]
description = "Platform-agnostic proxy configuration: detect system/env proxy settings, evaluate PAC files (with WPAD discovery), and wire the result into requests or urllib"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []
[project.optional-dependencies]
dev = ['build', 'twine', 'hatchling', 'pytest', 'requests']
# PAC-as-JS engines (proxylib.pac.engines) -- pick a specific one, or use the
# "jspac" meta-extra for "any working engine" (currently an alias for the
# default-priority one; see proxylib.pac.engines._DEFAULT_PRIORITY).
dukpy = ['dukpy']
quickjs = ['quickjs']
jspac = ['dukpy']
ifaddr = ['ifaddr']
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']

[project.urls]
Homepage = "https://github.com/jose-pr/proxylib/"
Documentation = "https://jose-pr.github.io/proxylib/"
Issues = "https://github.com/jose-pr/proxylib/issues"

[tool.hatch.build.targets.sdist]
exclude = ["/.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/proxylib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
