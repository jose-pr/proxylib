[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxylib"
version = "1.0.0rc1"
authors = [{ name = "Jose A" }]
description = "Platform-agnostic proxy configuration: detect system/env proxy settings, evaluate PAC files (with WPAD discovery), and wire the result into requests or urllib"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []
[project.optional-dependencies]
dev = ['build', 'twine', 'hatchling', 'pytest', 'requests']
jspac = ['dukpy']
ifaddr = ['ifaddr']
requests = ['requests']
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']

[project.urls]
Homepage = "https://github.com/jose-pr/proxylib/"
Documentation = "https://jose-pr.github.io/proxylib/"
Issues = "https://github.com/jose-pr/proxylib/issues"

[tool.hatch.build.targets.sdist]
exclude = ["/.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/proxylib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
