[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxylib"
version = "2.0.2"
authors = [{ name = "Jose A" }]
description = "Platform-agnostic proxy configuration: detect system/env proxy settings, evaluate PAC files (with WPAD discovery), and wire the result into requests or urllib"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["netimps>=0.4.0,<0.5", "importpatch>=0.2.1,<0.3"]
[project.optional-dependencies]
dev = ['build', 'twine', 'hatchling', 'pytest', 'requests', 'httpx', 'aiohttp']
# PAC-as-JS engines (proxylib.pac.engines). "pac" is the preferred engine;
# "dukpy" is the pure-wheel alternative for platforms quickjs does not build on.
pac = [
    'quickjs; python_version < "3.10"',
    'quickjs-ng; python_version >= "3.10"',
]
dukpy = ['dukpy']
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']

# proxylib's client integrations, in every program that imports the client
# (PROXYLIB_IMPORTPATCH chooses which use auto_proxy()).
[project.entry-points.importpatch]
requests = "proxylib.integrations.autopatch"
"urllib.request" = "proxylib.integrations.autopatch"
httpx = "proxylib.integrations.autopatch"
aiohttp = "proxylib.integrations.autopatch"
"pip._vendor.requests" = "proxylib.integrations.autopatch"

[project.urls]
Homepage = "https://github.com/jose-pr/proxylib/"
Documentation = "https://jose-pr.github.io/proxylib/"
Issues = "https://github.com/jose-pr/proxylib/issues"

[tool.hatch.build.targets.sdist]
exclude = ["/.*"]

[tool.hatch.build.targets.wheel]
packages = ["src/proxylib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
